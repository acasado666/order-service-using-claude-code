apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-service-ingress
  namespace: order-service
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
  annotations:
    # Nginx ingress controller
    kubernetes.io/ingress.class: nginx

    # Always redirect HTTP → HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting: 100 requests/second per client IP.
    # Requests exceeding the limit receive HTTP 429.
    # burst-multiplier allows a short spike before rejecting (default ×5 = 500 burst).
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # Body size limit (JSON order payloads are small)
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

    # TLS certificate via cert-manager (optional — remove if provisioning manually):
    #   cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - order-service.acme.com
      # Provision this secret via cert-manager, a manual kubectl create secret tls command,
      # or your cloud provider's certificate manager.
      secretName: order-service-tls
  rules:
    - host: order-service.acme.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
