apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: order-service
data:
  SPRING_PROFILES_ACTIVE: staging
  DB_HOST: postgres          # Change to the actual PostgreSQL service hostname or DNS
  DB_PORT: "5432"
  DB_NAME: orderDBClaude
  # JAVA_TOOL_OPTIONS is read automatically by the JVM without Dockerfile changes.
  # Complements -XX:+UseContainerSupport already baked into the image.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
