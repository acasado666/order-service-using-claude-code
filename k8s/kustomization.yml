apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: order-service

resources:
  - namespace.yml
  - configmap.yml
  - secret.yml
  - deployment.yml
  - service.yml
  - hpa.yml
  - ingress.yml

# Override the image tag at deploy time. In CI, run:
#   kustomize edit set image ghcr.io/your-org/order-service:${GITHUB_SHA}
# or pass --set-image to kubectl:
#   kubectl set image deployment/order-service \
#     order-service=ghcr.io/your-org/order-service:${GITHUB_SHA} \
#     -n order-service
images:
  - name: ghcr.io/your-org/order-service
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: order-service
  app.kubernetes.io/managed-by: kustomize
